<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="./css/style.css" />
  <title>HelpDesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>
  <header class="flex justify-between">
    <img class="w-45 h-20 ml-3 xl:ml-12" src="assets/images/logo.png" alt="log" />
    <p class="hidden md:block text-xs text-[#8A95A4] mr-6 mt-9 xl:mr-17">
      Atlas Solutions / Support
    </p>
    <div class="md:hidden">
      <i class="fa-solid fa-bars text-[30px] mt-6 mr-4 text-[rgba(70,82,100,1)]"></i>
    </div>
  </header>
  <main>
    <section class="py-[20px] px-[20px] bg-[#F7F8FA]">
      <h2 class="text-[23px] text-[#202A38] font-bold xl:ml-12">
        Gestion des demandes
      </h2>
      <p class="text-[11px] text-[#8792A1] py-[10px] xl:ml-12">
        Suivez et gérez les incidents informatiques.
      </p>
      <form id="form" novalidate
        class="mt-[10px] p-[10px] border border-[#FFFFFF] rounded-[15px] bg-[#FFFFFF] xl:ml-12 xl:mr-10">
        <h2 class="text-[18px] text-[#202A38] font-bold">
          Créer une demande
        </h2>
        <p class="text-[11px] text-[#8A95A4] pb-[10px]">
          Décrivez votre problème informatique.
        </p>
        <div
          class="text-[12px] grid grid-cols-[repeat(auto-fit,minmax(250px,1fr))] gap-[25px] xl:grid-cols-[2fr_1fr_1fr]">
          <label class="text-[#263441] font-bold flex flex-col">
            Titre du problème *
            <input
              class="border border-[#38434d] rounded-[5px] p-[10px] my-[10px] placeholder:text-[#364252]"
              type="text" name="titre" placeholder="Connexion Wi-Fi instable" required />
            <p id="titre_err" class="hidden mt-1 text-[11px] text-red-500 font-normal">
              Le titre doit contenir au moins 2 caractères.
            </p>
          </label>
          <label class="text-[#263441] font-bold flex flex-col">
            Catégorie *
            <select name="categorie"
              class="border border-[#38434d] rounded-[5px] p-[10px] my-[10px] placeholder:text-[#364252] "
              required>
              <option value="Réseau">Réseau</option>
              <option value="Matériel">Matériel</option>
              <option value="Logiciel">Logiciel</option>
            </select>
          </label>
          <label class="text-[#263441] font-bold flex flex-col">
            Priorité *
            <select name="priorite"
              class="border border-[#38434d] rounded-[5px] p-[10px] my-[10px] placeholder:text-[#364252]"
              required>
              <option value="Haute">Haute</option>
              <option value="Normale">Normale</option>
              <option value="Basse">Basse</option>
            </select>
          </label>
          <label class="text-[#263441] font-bold flex flex-col xl:col-span-3">Description *
            <textarea
              class="border border-[#38434d] rounded-[5px] p-2.5 my-2.5 placeholder:text-[#364252] resize-none"
              name="description" placeholder="Décrivez votre problème..." required></textarea>
            <p id="desc_err" class="hidden mt-1 text-[11px] text-red-500 font-normal">
              La description doit contenir au moins 2 caractères.
            </p>
          </label>
        </div>
        <div class="flex justify-end">
          <button type="submit" id="submit-btn"
            class="bg-[#252F3E] text-[#FFFFFF] rounded-[5px] text-[13px] w-full md:w-fit px-6 py-2 mt-2.5">
            ＋ Ajouter la demande
          </button>
        </div>
      </form>
    </section>
    <section class="py-[20px] px-[20px] bg-[#F7F8FA]">
      <div class="flex justify-between xl:ml-12">
        <div class="w-full flex justify-between md:w-fit">
          <h2 class="text-[18px] text-[#202A38] font-bold md:text-[21px]">
            Liste des demandes
          </h2>
          <p id= "demandes">
          </p>
        </div>
        <div class="bg-[#EDF0F4] hidden md:block md:rounded-xl md:flex md:align-middle md:gap-2.5 xl:mr-10">
          <button id="carte-btn" class="px-2 bg-[#FFFFFF] text-xs text-[#202A38] rounded-xl font-bold">
            ▦ Cartes
          </button>
          <button id="list-btn" class="px-2 text-[#202A38] text-xs">
            ☷ Tableau
          </button>
        </div>
      </div>
      <div id="articles" class="md:grid md:grid-cols-2 md:gap-x-5 xl:mr-15 xl:grid-cols-3 xl:ml-12 md:gap-x-10">
      </div>
      <div id="table" class="hidden max-md:hidden xl:ml-12 xl:mr-10 mt-5">
      <table class="w-full text-left text-xs text-[#6B7686] bg-white rounded-xl">
        <thead>
            <tr class="bg-[#FAFBFC] border-b border-[#EDF0F3]">
                <th class="py-5 px-5">N° Ticket</th>
                <th class="py-5">Titre de la demande</th>
                <th class="py-5 px-2.5">Catégorie</th>
                <th class="py-5 px-2.5">Priorité</th>
                <th class="py-5">Action</th>
            </tr>
        </thead>
        <tbody id="t_body">
        </tbody>
    </table>
</div>
      </div>
    </section>
    <script src="js/script.js"></script>
  </main>
</body>

</html>
