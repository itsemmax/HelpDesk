<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>HelpDesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <header class="flex justify-between">
      <img class="w-45 h-20 ml-5" src="assets/images/logo.png" alt="log" />
      <p class="hidden ">Atlas Solutions / Support</p>
      <i class="fa-solid fa-bars text-[30px] mt-6 mr-4 text-[rgba(70,82,100,1)]"></i>
    </header>
    <main>
      <section class="py-[20px] px-[20px] bg-[#F7F8FA]">
        <h2 class="text-[23px] text-[#202A38] font-bold">Gestion des demandes</h2>
        <p class="text-[11px] text-[#8792A1] py-[10px]">
          Suivez et gérez les incidents informatiques.
        </p>
        <form class="mt-[10px] p-[10px] border border-[#FFFFFF] rounded-[15px] bg-[#FFFFFF]">
          <h2 class="text-[18px] text-[#202A38] font-bold ">Créer une demande</h2>
          <p class="text-[11px] text-[#8A95A4] pb-[10px]">Décrivez votre problème informatique.</p>
          <div class="text-[12px] grid grid-cols-[repeat(auto-fit,minmax(300px,1fr))] gap-[25px]">
          <label class="text-[#263441] font-bold flex flex-col">
            Titre du problème *
          <input class="border border-[#38434d] rounded-[5px] p-[10px] my-[10px] placeholder:text-[#364252] font-light"
            type="text"
            name="titre"
            placeholder="Connexion Wi-Fi instable"
            required
          />
          </label>
          <label class="text-[#263441] font-bold flex flex-col">
            Catégorie *
          <select name="categorie" class="border border-[#38434d] rounded-[5px] p-[10px] my-[10px] placeholder:text-[#364252] font-light" required>
            <option value="Réseau">Réseau</option>
            <option value="Matériel">Matériel</option>
            <option value="Logiciel">Logiciel</option>
          </select>
          </label>
          <label class="text-[#263441] font-bold flex flex-col">
            Priorité *
          <select name="priorite" class="border border-[#38434d] rounded-[5px] p-[10px] my-[10px] placeholder:text-[#364252] font-light" required>
            <option value="Haute">Haute</option>
            <option value="Normale">Normale</option>
            <option value="Basse">Basse</option>
          </select>
          </label>
          <label class="text-[#263441] font-bold flex flex-col">Description *
          <textarea
            class="border border-[#38434d] rounded-[5px] p-[10px] my-[10px] placeholder:text-[#364252] font-light resize-none"
            name="description"
            placeholder="Décrivez votre problème..."
            required
          ></textarea>
          </label>
          <button type="submit" class="bg-[#252F3E] text-[#FFFFFF] h-[35px] rounded-[5px]">＋ Ajouter la demande</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
